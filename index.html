<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accelerate</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@600;800&display=swap">
<style>
  /* Layout: split-screen 3D canvas, scoreboard above; arcade dark, single theme */
  :root{
    --bg:#101418; --panel:#1a2129; --fg:#f2f4f6; --muted:#8e9aa8;
    --p1:#ff5a3c; --p2:#3cc8ff;
    --display:'Bungee',Impact,'Arial Black',sans-serif;
    --body:'Nunito',system-ui,sans-serif;
    color-scheme:dark;
  }
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);
    padding-block:16px;
    padding-left:max(16px,env(safe-area-inset-left,0px));
    padding-right:max(16px,env(safe-area-inset-right,0px));
    display:flex;flex-direction:column;align-items:center;gap:14px}
  h1{font-family:var(--display);font-size:clamp(22px,5vw,34px);margin:0;letter-spacing:.02em;text-wrap:balance}
  .board{display:flex;gap:12px;width:min(100%,900px)}
  .car{flex:1;min-width:0;background:var(--panel);border-radius:10px;padding:10px 14px;border-left:6px solid}
  .car.p1{border-color:var(--p1)} .car.p2{border-color:var(--p2)}
  .car .name{font-family:var(--display);font-size:14px;letter-spacing:.04em}
  .car .keys{color:var(--muted);font-size:12px}
  .car .lap{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
  .car .time{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
  .wrap{position:relative;width:min(100%,900px);max-width:100%;aspect-ratio:900/480;background:#000;border-radius:12px;overflow:hidden}
  canvas{display:block;width:100%;height:100%}
  .divider{position:absolute;left:50%;top:0;bottom:0;width:4px;background:var(--bg);transform:translateX(-50%)}
  .overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(16,20,24,.72);text-align:center;padding:0 16px}
  .overlay[hidden],.divider[hidden]{display:none}
  .overlay h2{font-family:var(--display);font-size:clamp(24px,6vw,44px);margin:0}
  .overlay p{margin:0;color:var(--muted);max-width:40ch}
  button{font-family:var(--display);font-size:16px;letter-spacing:.04em;background:var(--fg);color:var(--bg);border:0;border-radius:8px;padding:12px 22px;cursor:pointer}
  button:focus-visible{outline:3px solid var(--p2);outline-offset:2px}
  .hint{color:var(--muted);font-size:13px;text-align:center;max-width:60ch}
</style>
</head>
<body>
<h1>Accelerate</h1>
<div class="board">
  <div class="car p1"><div class="name">RED</div><div class="keys">W A S D · left screen</div><div class="lap" id="lap1">Lap 1 / 3</div><div class="time" id="time1">0.00s</div></div>
  <div class="car p2"><div class="name">BLUE</div><div class="keys">↑ ← ↓ → · right screen</div><div class="lap" id="lap2">Lap 1 / 3</div><div class="time" id="time2">0.00s</div></div>
</div>
<div class="wrap">
  <canvas id="c"></canvas>
  <div class="divider" id="divider"></div>
  <div class="overlay" id="overlay">
    <h2 id="otitle">Split screen, one keyboard</h2>
    <p id="omsg">First to finish 3 laps wins. Stay on the road: grass is slow.</p>
    <button id="start">Start race</button>
  </div>
</div>
<p class="hint">Click the track first so it hears your keys. Each player gets their own camera. Press M for the overhead map.</p>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  // ===================== TRACK DEFINITION =====================
  // The track is a list of points down the middle of the road, traced from
  // design/Track1.webp. Coordinates are fractions of the drawing page:
  // x goes 0 (left edge) to 1 (right edge), y goes 0 (top) to 1 (bottom).
  // Points are in driving order and the first point is the start/finish line.
  // Cars drive UP the left straight (clockwise seen from above).
  const TRACK1 = {
    name:'Track 1',
    laps:3,          // laps to win on this track
    width:14,        // road width in world units (a car is 2 wide)
    points:[
      [0.15,0.52],                                   // start/finish, left straight, heading up
      [0.15,0.40],[0.15,0.31],                       // up the left straight
      [0.19,0.23],[0.26,0.16],[0.35,0.11],           // sweep up and right
      [0.45,0.08],[0.60,0.07],[0.75,0.07],[0.86,0.09], // top straight (jump, speed pad later)
      [0.90,0.17],[0.90,0.30],[0.89,0.45],[0.89,0.65],[0.88,0.78], // right straight (deer, mud, loop later)
      [0.83,0.90],[0.73,0.94],[0.64,0.91],           // bottom-right corner, short run left
      [0.60,0.82],[0.59,0.70],                       // up the inner leg (mud later)
      [0.55,0.63],[0.45,0.62],[0.37,0.64],           // across the top of the inner U (half-pipe turn later)
      [0.33,0.73],[0.33,0.85],                       // down the other inner leg
      [0.29,0.94],[0.20,0.95],[0.15,0.88],           // hairpin at the bottom-left
      [0.15,0.75],[0.15,0.63]                        // up the left straight to the line (speed pad later)
    ]
  };
  // Size of the drawing page in world units (portrait page, 3:4).
  const PAGE_W=240, PAGE_H=320;

  const TRACK=TRACK1, LAPS=TRACK.laps, CPS=4;

  // ===================== RENDERER + SCENE =====================
  const cv=document.getElementById('c');
  const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
  renderer.shadowMap.enabled=true;
  const scene=new THREE.Scene();
  scene.background=new THREE.Color(0x8fd3ff);
  scene.fog=new THREE.Fog(0x8fd3ff,160,460);

  // Lights
  scene.add(new THREE.HemisphereLight(0xffffff,0x3a6b2a,0.7));
  const sun=new THREE.DirectionalLight(0xffffff,0.9);
  sun.position.set(120,180,80); sun.castShadow=true;
  sun.shadow.mapSize.set(2048,2048);
  Object.assign(sun.shadow.camera,{left:-220,right:220,top:220,bottom:-220,far:600});
  scene.add(sun);

  // ===================== BUILD THE TRACK =====================
  // 1. Turn the drawing points into a smooth closed curve.
  const ctrl=TRACK.points.map(([px,py])=>new THREE.Vector3((px-0.5)*PAGE_W,0,(py-0.5)*PAGE_H));
  const curve=new THREE.CatmullRomCurve3(ctrl,true,'centripetal');
  // 2. Sample it into N evenly spaced points. Everything else reads from `samples`:
  //    p = position on the centerline, t = direction of travel, n = sideways (across the road).
  const N=400, samples=[];
  { const pts=curve.getSpacedPoints(N); // N+1 points, last == first
    for(let i=0;i<N;i++){
      const p=pts[i], q=pts[(i+1)%N];
      const t=new THREE.Vector3().subVectors(q,p); t.y=0; t.normalize();
      samples.push({p,t,n:new THREE.Vector3(-t.z,0,t.x)});
    } }
  const lapLength=samples.length*samples[0].p.distanceTo(samples[1].p);

  // Grass
  const grass=new THREE.Mesh(new THREE.PlaneGeometry(900,900),new THREE.MeshLambertMaterial({color:0x4a9a4a}));
  grass.rotation.x=-Math.PI/2; grass.receiveShadow=true; scene.add(grass);

  // Road: a ribbon of quads, two vertices per sample (left edge, right edge)
  { const pos=new Float32Array(N*6), idx=[], hw=TRACK.width/2;
    samples.forEach((s,i)=>{
      const l=s.p.clone().addScaledVector(s.n,hw), r=s.p.clone().addScaledVector(s.n,-hw);
      pos.set([l.x,0,l.z,r.x,0,r.z],i*6);
      const j=(i+1)%N; idx.push(i*2,j*2,i*2+1, i*2+1,j*2,j*2+1);
    });
    const g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.BufferAttribute(pos,3)); g.setIndex(idx); g.computeVertexNormals();
    const road=new THREE.Mesh(g,new THREE.MeshLambertMaterial({color:0x444a52}));
    road.position.y=0.02; road.receiveShadow=true; scene.add(road); }

  // Curbs: red/white blocks along both edges (instanced so it's one draw call per color)
  { const geo=new THREE.BoxGeometry(2.4,0.3,0.9), hw=TRACK.width/2+0.5;
    const red=new THREE.InstancedMesh(geo,new THREE.MeshLambertMaterial({color:0xd63b2f}),N);
    const white=new THREE.InstancedMesh(geo,new THREE.MeshLambertMaterial({color:0xe8e8e8}),N);
    const m=new THREE.Matrix4(), q=new THREE.Quaternion(), sc=new THREE.Vector3(1,1,1), up=new THREE.Vector3(0,1,0);
    let ri=0, wi=0;
    samples.forEach((s,i)=>{
      q.setFromAxisAngle(up,-Math.atan2(s.t.z,s.t.x));
      for(const side of [1,-1]){
        const p=s.p.clone().addScaledVector(s.n,side*hw); p.y=0.15;
        m.compose(p,q,sc);
        if((i+(side>0?0:1))%2) white.setMatrixAt(wi++,m); else red.setMatrixAt(ri++,m);
      }
    });
    red.count=ri; white.count=wi; scene.add(red,white); }

  // Start/finish line: checkered squares across the road at sample 0
  { const s=samples[0], hw=TRACK.width/2, cell=2, cols=Math.floor(TRACK.width/cell);
    const geo=new THREE.PlaneGeometry(cell,cell); geo.rotateX(-Math.PI/2);
    const dark=new THREE.MeshLambertMaterial({color:0x111111}), light=new THREE.MeshLambertMaterial({color:0xffffff});
    for(let row=0;row<2;row++) for(let k=0;k<cols;k++){
      const sq=new THREE.Mesh(geo,(row+k)%2?dark:light);
      sq.position.copy(s.p).addScaledVector(s.n,-hw+cell/2+k*cell).addScaledVector(s.t,(row-0.5)*cell);
      sq.position.y=0.04; sq.rotation.y=-Math.atan2(s.t.z,s.t.x); scene.add(sq);
    } }

  // Trees for depth: scattered anywhere that isn't road
  { let placed=0, tries=0;
    while(placed<80&&tries<2000){ tries++;
      const x=(Math.random()-0.5)*(PAGE_W+140), z=(Math.random()-0.5)*(PAGE_H+140);
      if(nearest(x,z).d<TRACK.width/2+5) continue;
      const trunk=new THREE.Mesh(new THREE.CylinderGeometry(0.4,0.5,3),new THREE.MeshLambertMaterial({color:0x6b4a2b}));
      const top=new THREE.Mesh(new THREE.ConeGeometry(2.5,6,8),new THREE.MeshLambertMaterial({color:0x2f7a3a}));
      trunk.position.set(x,1.5,z); top.position.set(x,6,z); top.castShadow=true;
      scene.add(trunk,top); placed++;
    } }

  // ===================== TRACK QUERIES =====================
  // Closest centerline sample to a point: its index (how far round the lap) and distance (how far off center).
  function nearest(x,z){
    let best=0, bd=Infinity;
    for(let i=0;i<N;i++){ const p=samples[i].p, d=(p.x-x)*(p.x-x)+(p.z-z)*(p.z-z); if(d<bd){bd=d;best=i;} }
    return {i:best,d:Math.sqrt(bd)};
  }
  const onRoadDist=TRACK.width/2+0.5;

  // ===================== CARS =====================
  function buildCar(color){
    const g=new THREE.Group();
    const body=new THREE.Mesh(new THREE.BoxGeometry(2,0.8,4),new THREE.MeshLambertMaterial({color}));
    body.position.y=0.7; body.castShadow=true; g.add(body);
    const cabin=new THREE.Mesh(new THREE.BoxGeometry(1.6,0.7,1.8),new THREE.MeshLambertMaterial({color:0xdff6ff}));
    cabin.position.set(0,1.4,-0.2); cabin.castShadow=true; g.add(cabin);
    const wm=new THREE.MeshLambertMaterial({color:0x111111});
    for(const [x,z] of [[-1.05,1.3],[1.05,1.3],[-1.05,-1.3],[1.05,-1.3]]){
      const w=new THREE.Mesh(new THREE.CylinderGeometry(0.45,0.45,0.4,12),wm);
      w.rotation.z=Math.PI/2; w.position.set(x,0.45,z); g.add(w);
    }
    scene.add(g); return g;
  }
  function makeCar(color,side,keys){
    return {mesh:buildCar(color),keys,side,a:0,v:0,lap:1,cp:0,time:0,done:false,finishTime:0,
      cam:new THREE.PerspectiveCamera(60,1,0.5,500)};
  }
  const cars=[
    makeCar(0xff5a3c, 1,{up:'KeyW',down:'KeyS',left:'KeyA',right:'KeyD'}),
    makeCar(0x3cc8ff,-1,{up:'ArrowUp',down:'ArrowDown',left:'ArrowLeft',right:'ArrowRight'})
  ];
  const keys={};
  let overhead=false;
  addEventListener('keydown',e=>{
    keys[e.code]=true;
    if(e.code.startsWith('Arrow')) e.preventDefault();
    if(e.code==='KeyM'&&!e.repeat){ overhead=!overhead; document.getElementById('divider').hidden=overhead; }
  });
  addEventListener('keyup',e=>{keys[e.code]=false;});

  // Put both cars just behind the start line, side by side, facing down the track
  function reset(){
    const s=samples[0];
    for(const c of cars){
      c.mesh.position.copy(s.p).addScaledVector(s.t,-4).addScaledVector(s.n,c.side*TRACK.width/4);
      c.mesh.position.y=0;
      c.a=Math.atan2(s.t.z,s.t.x);
      c.v=0; c.lap=1; c.cp=0; c.time=0; c.done=false; c.finishTime=0;
      c.mesh.rotation.y=-c.a+Math.PI/2;
      updateCam(c,true);
    }
  }

  let running=false, winner=null, last=0;
  function step(dt){
    for(const c of cars){
      if(c.done) continue;
      c.time+=dt;
      const p=c.mesh.position, k=c.keys;
      const near=nearest(p.x,p.z), road=near.d<=onRoadDist;
      const maxV=road?42:16, accel=road?34:16;
      if(keys[k.up]) c.v+=accel*dt;
      if(keys[k.down]) c.v-=accel*0.8*dt;
      c.v*=road?0.99:0.95;
      c.v=Math.max(-maxV/2,Math.min(maxV,c.v));
      const turn=2.4*Math.min(1,Math.abs(c.v)/15)*(c.v<0?-1:1);
      if(keys[k.left]) c.a-=turn*dt;
      if(keys[k.right]) c.a+=turn*dt;
      p.x+=Math.cos(c.a)*c.v*dt; p.z+=Math.sin(c.a)*c.v*dt;
      p.x=Math.max(-440,Math.min(440,p.x)); p.z=Math.max(-440,Math.min(440,p.z));
      c.mesh.rotation.y=-c.a+Math.PI/2;
      // Lap counting: the lap is split into CPS sectors that must be passed in order.
      const s=Math.floor(near.i*CPS/N);
      if(s===(c.cp+1)%CPS){ c.cp=s; if(s===0){ c.lap++; if(c.lap>LAPS){c.done=true;c.finishTime=c.time;c.lap=LAPS; if(!winner){winner=c;endRace();}} } }
      updateCam(c,false);
    }
    // simple car-vs-car bump
    const a=cars[0].mesh.position, b=cars[1].mesh.position;
    const dx=b.x-a.x, dz=b.z-a.z, d=Math.hypot(dx,dz);
    if(d<3.2&&d>0){ const push=(3.2-d)/2; a.x-=dx/d*push; a.z-=dz/d*push; b.x+=dx/d*push; b.z+=dz/d*push; }
  }
  function updateCam(c,snap){
    const p=c.mesh.position;
    const target=new THREE.Vector3(p.x-Math.cos(c.a)*12,7,p.z-Math.sin(c.a)*12);
    if(snap) c.cam.position.copy(target); else c.cam.position.lerp(target,0.12);
    c.cam.lookAt(p.x+Math.cos(c.a)*6,1.5,p.z+Math.sin(c.a)*6);
  }

  // Overhead map camera (press M): looks straight down with the page's top at the top of the screen
  const mapCam=new THREE.OrthographicCamera(-1,1,1,-1,1,2000);
  mapCam.position.set(0,600,0); mapCam.up.set(0,0,-1); mapCam.lookAt(0,0,0);

  function resize(){
    const w=cv.clientWidth, h=cv.clientHeight, pr=renderer.getPixelRatio();
    if(cv.width!==Math.floor(w*pr)||cv.height!==Math.floor(h*pr)) renderer.setSize(w,h,false);
    for(const c of cars){ c.cam.aspect=(w/2)/h; c.cam.updateProjectionMatrix(); }
    const aspect=w/h, halfH=Math.max(PAGE_H/2+20,(PAGE_W/2+20)/aspect), halfW=halfH*aspect;
    mapCam.left=-halfW; mapCam.right=halfW; mapCam.top=halfH; mapCam.bottom=-halfH; mapCam.updateProjectionMatrix();
    return [w,h];
  }
  function render(){
    const [w,h]=resize();
    if(overhead){
      const fog=scene.fog; scene.fog=null; // fog would hide everything from this high up
      renderer.setScissorTest(false); renderer.setViewport(0,0,w,h); renderer.render(scene,mapCam);
      scene.fog=fog;
    } else {
      renderer.setScissorTest(true);
      cars.forEach((c,i)=>{
        const x=i*w/2;
        renderer.setViewport(x,0,w/2,h); renderer.setScissor(x,0,w/2,h);
        renderer.render(scene,c.cam);
      });
    }
    document.getElementById('lap1').textContent=`Lap ${cars[0].lap} / ${LAPS}`;
    document.getElementById('lap2').textContent=`Lap ${cars[1].lap} / ${LAPS}`;
    document.getElementById('time1').textContent=(cars[0].done?cars[0].finishTime:cars[0].time).toFixed(2)+'s';
    document.getElementById('time2').textContent=(cars[1].done?cars[1].finishTime:cars[1].time).toFixed(2)+'s';
  }
  function loop(t){ const dt=Math.min(0.05,(t-last)/1000); last=t; if(running) step(dt); render(); requestAnimationFrame(loop); }
  const overlay=document.getElementById('overlay');
  function endRace(){
    running=false;
    const name=winner===cars[0]?'Red':'Blue';
    document.getElementById('otitle').textContent=`${name} wins!`;
    document.getElementById('omsg').textContent=`Finished ${LAPS} laps in ${winner.finishTime.toFixed(2)} seconds.`;
    document.getElementById('start').textContent='Race again';
    overlay.hidden=false;
  }
  document.getElementById('omsg').textContent=`First to finish ${LAPS} laps wins. Stay on the road: grass is slow.`;
  document.getElementById('start').addEventListener('click',()=>{ reset(); winner=null; overlay.hidden=true; running=true; });
  reset();
  requestAnimationFrame(t=>{last=t;loop(t);});

  // Handy for poking at the game from the browser console
  window.ACCEL={TRACK,samples,cars,keys,nearest,lapLength};
})();
</script>
</body>
</html>
